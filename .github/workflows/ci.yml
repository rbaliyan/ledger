name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test
          POSTGRES_DB: ledger_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: ledger_test
          CLICKHOUSE_PASSWORD: ledger_test
          CLICKHOUSE_DB: ledger_test
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user ledger_test --password ledger_test --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start MongoDB replica set
        run: |
          docker run -d --name ledger-mongo-test \
            -p 27020:27017 \
            mongo:7.0 --replSet rs0
          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 30); do
            docker exec ledger-mongo-test mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "1" && break
            sleep 1
          done
          echo "Initialising replica set..."
          docker exec ledger-mongo-test mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          echo "Waiting for primary election..."
          for i in $(seq 1 30); do
            docker exec ledger-mongo-test mongosh --quiet --eval "rs.isMaster().ismaster" 2>/dev/null | grep -q "^true$" && break
            sleep 1
          done
          echo "MongoDB replica set ready"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          POSTGRES_DSN: postgres://ledger_test:ledger_test@localhost:5434/ledger_test?sslmode=disable
          MONGO_URI: mongodb://localhost:27020/?directConnection=true
          CLICKHOUSE_DSN: clickhouse://ledger_test:ledger_test@127.0.0.1:9000/ledger_test
        run: go test -tags=integration -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage gate on in-process packages
        # These packages have no external (Docker-gated) dependencies, so their
        # coverage is deterministic across runs. Gate total coverage over them at
        # a conservative threshold to catch regressions without flaking on the
        # backend-gated packages.
        run: |
          set -euo pipefail
          THRESHOLD=75.0
          PKGS="github.com/rbaliyan/ledger \
                github.com/rbaliyan/ledger/webhook \
                github.com/rbaliyan/ledger/internal/config \
                github.com/rbaliyan/ledger/internal/daemon \
                github.com/rbaliyan/ledger/ledgerpb"
          # shellcheck disable=SC2086
          go test -coverprofile=cover-gate.out -covermode=atomic $PKGS
          TOTAL=$(go tool cover -func=cover-gate.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "In-process package coverage: ${TOTAL}% (threshold ${THRESHOLD}%)"
          awk -v t="$THRESHOLD" -v c="$TOTAL" 'BEGIN { if (c+0 < t+0) { printf "coverage %.1f%% is below threshold %.1f%%\n", c, t; exit 1 } }'

      - name: Benchmark smoke test
        # Run every benchmark once to catch compile/panic regressions cheaply.
        # -benchtime=10x keeps it fast; the benchmarks are deterministic and
        # dep-free (in-memory SQLite, pure functions), so this is not a
        # performance gate — just a guard that the bench suite still builds and
        # runs without panicking.
        run: go test -run '^$' -bench=. -benchtime=10x ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          args: --tests=false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          category: "/language:go"
