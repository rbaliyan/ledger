name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test
          POSTGRES_DB: ledger_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: ledger_test
          CLICKHOUSE_PASSWORD: ledger_test
          CLICKHOUSE_DB: ledger_test
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user ledger_test --password ledger_test --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Start MongoDB replica set
        run: |
          docker run -d --name ledger-mongo-test \
            -p 27020:27017 \
            mongo:7.0 --replSet rs0
          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 30); do
            docker exec ledger-mongo-test mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "1" && break
            sleep 1
          done
          echo "Initialising replica set..."
          docker exec ledger-mongo-test mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          echo "Waiting for primary election..."
          for i in $(seq 1 30); do
            docker exec ledger-mongo-test mongosh --quiet --eval "rs.isMaster().ismaster" 2>/dev/null | grep -q "^true$" && break
            sleep 1
          done
          echo "MongoDB replica set ready"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          POSTGRES_DSN: postgres://ledger_test:ledger_test@localhost:5434/ledger_test?sslmode=disable
          MONGO_URI: mongodb://localhost:27020/?directConnection=true
          CLICKHOUSE_DSN: clickhouse://ledger_test:ledger_test@127.0.0.1:9000/ledger_test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11.4
          args: --tests=false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          category: "/language:go"
